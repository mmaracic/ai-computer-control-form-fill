[project]
name = "ai-computer-control-form-fill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling[easyocr]==2.77.0",
    "fastapi==0.129.0",
    "langfuse==3.14.4",
    "openai-agents[litellm]==0.9.0",
    "openinference-instrumentation-openai-agents==1.4.0",
    "playwright==1.58.0",
    "psycopg[binary]==3.3.3",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "tiktoken>=0.12.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "uvicorn==0.40.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
